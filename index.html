<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><meta name="description" content="摸摸、喂食、逗猫。在忙碌的一天，留一点温柔给自己。"><title>今天也要摸摸猫</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><a class="brand" href="./">PAWS & PEACE <span>猫咪的小日子</span></a><button id="sound" class="icon" aria-label="开启声音" aria-pressed="false">♪</button></header>
<section class="intro"><p class="eyebrow">A LITTLE MOMENT, JUST FOR YOU</p><h1>今天也要<br>摸摸猫<span>。</span></h1><p class="subtitle">世界很忙，还好这里有一只猫。</p></section>
<section class="game" aria-label="猫咪互动区域"><div class="room-top"><span><i></i> 奶糖的小窝</span><button id="albumOpen">心动收藏 <span id="count">0/4</span> ↗</button></div><div class="window"><div class="sun"></div><div class="cloud"></div></div><div class="plant"><span>❧</span><div></div></div><div class="picture">stay<br>soft ♡</div><div class="floor"></div><div class="rug"></div><div id="bubble" role="status" aria-live="polite">你好呀，等你好久啦。</div>
<button id="cat" aria-label="摸摸奶糖，点击或滑动猫咪" class="cat"><svg viewBox="0 0 340 300" aria-hidden="true"><defs><linearGradient id="fur" x2="0" y2="1"><stop stop-color="#f8d6a2"/><stop offset="1" stop-color="#eebd82"/></linearGradient></defs><ellipse cx="172" cy="271" rx="110" ry="12" fill="#795e4520"/><path class="tail" d="M235 238 Q315 248 296 188 Q286 164 273 184 Q270 195 280 207 Q286 227 244 218" fill="#e9b67b" stroke="#775c46" stroke-width="4"/><ellipse cx="174" cy="222" rx="76" ry="53" fill="url(#fur)" stroke="#775c46" stroke-width="4"/><ellipse cx="172" cy="233" rx="40" ry="34" fill="#fff0d6"/><path d="M88 119 L91 40 Q94 25 108 40 L144 73 M201 74 L242 37 Q254 28 255 45 L260 122" fill="url(#fur)" stroke="#775c46" stroke-width="4" stroke-linejoin="round"/><path d="M102 78 L103 48 L126 73 M218 73 L244 48 L245 86" fill="#e9a89a"/><path d="M89 114 Q89 67 174 68 Q259 67 263 121 Q278 197 176 202 Q75 199 89 114" fill="url(#fur)" stroke="#775c46" stroke-width="4"/><path d="M152 72 L157 92 M174 70 L174 94 M195 72 L190 92" stroke="#d79d62" stroke-width="8" stroke-linecap="round"/><g class="eyes" fill="#624e41"><ellipse cx="132" cy="132" rx="6" ry="9"/><ellipse cx="215" cy="132" rx="6" ry="9"/></g><g class="happyeyes" fill="none" stroke="#624e41" stroke-width="4" stroke-linecap="round"><path d="M121 136 Q132 124 143 136 M204 136 Q215 124 226 136"/></g><ellipse cx="115" cy="151" rx="14" ry="7" fill="#e8a396" opacity=".6"/><ellipse cx="232" cy="151" rx="14" ry="7" fill="#e8a396" opacity=".6"/><path d="M168 147 Q174 143 180 147 L174 153Z" fill="#b67d72"/><path d="M174 153 Q174 167 160 161 M174 153 Q174 167 188 161" fill="none" stroke="#775c46" stroke-width="3" stroke-linecap="round"/><path d="M100 149 L73 144 M101 158 L76 163 M247 149 L274 143 M246 159 L272 164" stroke="#997659" stroke-width="2" stroke-linecap="round"/><ellipse cx="127" cy="264" rx="25" ry="13" fill="#fff0d6" stroke="#775c46" stroke-width="3"/><ellipse cx="216" cy="264" rx="25" ry="13" fill="#fff0d6" stroke="#775c46" stroke-width="3"/><path d="M147 193 Q175 209 200 193" fill="none" stroke="#8b9b7a" stroke-width="9"/><circle cx="174" cy="204" r="9" fill="#e5bf65" stroke="#997d42" stroke-width="2"/></svg></button><div id="toy" aria-hidden="true">🪶</div><div id="effects" aria-hidden="true"></div><p class="hint">轻轻点一点，或滑动摸摸它</p><div class="cat-label">奶糖 <span>一只慢热的小橘猫</span></div></section>
<section class="connection"><div><span id="level">初次见面</span><span class="points">♡ <b id="love">0</b><small id="next"> / 30</small></span></div><div class="track"><div id="progress"></div></div><p id="goal">再收集 30 点好感，听听它的呼噜声</p></section>
<section class="actions" aria-label="选择互动方式"><button id="pet"><span>♡</span><strong>摸摸</strong><small>把温柔给它</small></button><button id="feed"><span>♧</span><strong>喂食</strong><small id="foodText">小鱼干 × 5</small></button><button id="play"><span>〰</span><strong>逗猫</strong><small>一起玩一会</small></button></section><div class="daily"><span>✧</span><p id="dailyText">今日小心愿：陪奶糖互动 10 次</p><b id="dailyCount">0/10</b></div><footer>不用赶时间，陪伴本身就有意义。<span>你的进度会自动保存在这台设备上</span></footer></main>
<dialog id="album"><button class="close" aria-label="关闭收藏">×</button><p class="eyebrow">OUR LITTLE MEMORIES</p><h2>和奶糖的心动收藏</h2><p>每一点靠近，都值得被记住。</p><div id="cards"></div><button class="done">继续陪陪它</button></dialog><script src="game.js"></script></body></html>
